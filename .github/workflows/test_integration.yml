name: integration tests

# Manual only — needs Elasticsearch, Chrome, and often the live Candhis site.
# Local: make run-infra && make test-integration

on:
  workflow_dispatch:

jobs:
    integration_tests:
        name: Run integration tests
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4

        - uses: adambirds/docker-compose-action@v1.5.0
          with:
            services: |
                postgres
                migrate
                elasticsearch

        - name: Wait for Elasticsearch to be ready
          run: |
            for i in $(seq 1 60); do
              body=$(curl -sf http://localhost:9200/_cluster/health || true)
              if echo "$body" | grep -qE '"status":"(green|yellow)"'; then
                echo "Elasticsearch is ready"
                echo "$body"
                exit 0
              fi
              echo "Waiting for Elasticsearch... ($i/60)"
              sleep 5
            done
            echo "Elasticsearch did not become ready in time"
            docker ps -a || true
            docker logs elasticsearch || true
            exit 1

        - name: Run and wait for Headless Chrome to be ready
          run: |
            make chrome-headless
            for i in $(seq 1 30); do
              if curl -sf http://localhost:9222/json/version | grep -q 'webSocketDebuggerUrl'; then
                echo "Chrome is ready"
                exit 0
              fi
              echo "Waiting for Headless Chrome... ($i/30)"
              sleep 2
            done
            echo "Chrome failed to start"
            exit 1

        - name: Setup Go environment
          uses: actions/setup-go@v5
          with:
            go-version: 1.23

        - name: Integration tests
          run: make download test-integration
