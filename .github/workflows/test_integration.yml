name: integration tests

on:
  pull_request:
    branches: [ "*" ]
  workflow_call:

jobs:
    integration_tests:
        name: Run integration tests
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4

        - uses: adambirds/docker-compose-action@v1.5.0
          with:
            services: |
                postgres
                migrate
                elasticsearch

        - name: Wait for Elasticsearch to be ready
          run: |
            # Single-node clusters often stay yellow; green is not required.
            for i in $(seq 1 60); do
              status=$(curl -sf http://localhost:9200/_cluster/health | grep -oE '"status":"(green|yellow|red)"' || true)
              if echo "$status" | grep -qE 'green|yellow'; then
                echo "Elasticsearch is ready ($status)"
                exit 0
              fi
              echo "Waiting for Elasticsearch... ($i/60)"
              sleep 5
            done
            echo "Elasticsearch did not become ready in time"
            curl -s http://localhost:9200/_cluster/health || true
            exit 1

        - name: Run and wait for Headless Chrome to be ready
          run: |
            make chrome-headless
            for i in $(seq 1 30); do
              if curl -sf http://localhost:9222/json/version | grep -q 'webSocketDebuggerUrl'; then
                echo "Chrome is ready"
                exit 0
              fi
              echo "Waiting for Headless Chrome... ($i/30)"
              sleep 2
            done
            echo "Chrome failed to start"
            exit 1

        - name: Setup Go environment
          uses: actions/setup-go@v5
          with:
            go-version: 1.23

        - name: Integration tests
          run: make download test-integration
