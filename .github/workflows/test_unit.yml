name: Unit tests

on:
  pull_request:
    branches: [ "*" ]
  workflow_call:

jobs:
  unit_tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go environment
      uses: actions/setup-go@v5
      with:
        go-version: 1.23

    - name: Run unit tests
      run: make download deps_test generate test-unit
